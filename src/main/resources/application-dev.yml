server:
  port: 10001
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: aioserver
  config:
    activate:
      on-profile: dev

  # 数据源配置 - 生产环境
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/aioserver?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
    username: root
    password: ${DB_PASSWORD:gaoyifeng}
    hikari:
      minimum-idle: 10
      maximum-pool-size: 50
      auto-commit: true
      idle-timeout: 60000
      pool-name: AioserverProdHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1

  # MyBatis配置
  mybatis:
    mapper-locations: classpath:mapper/**/*.xml
    type-aliases-package: com.gaoyifeng.aioserver.infrastructure.*.dao
    configuration:
      map-underscore-to-camel-case: true
      cache-enabled: true
      call-setters-on-nulls: true
      jdbc-type-for-null: 'null'

# 智谱AI配置
zhipu:
  ai:
    api-key: 60234c9f009c4f999781b7dcdd68a02a.TJaVn9qPenwCxZEO
    model: glm-4.5
    max-tokens: 2000
    temperature: 0.7
    timeout: 30000

# 日志配置 - 生产环境
logging:
  level:
    com.gaoyifeng.aioserver: INFO
    org.springframework: WARN
    org.mybatis: INFO
    root: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/aioserver.log
    max-size: 50MB
    max-history: 60