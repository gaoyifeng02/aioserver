server:
  port: 10001
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: aioserver

  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://118.126.105.56:13306/aioserver?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
    username: root
    password: Gaoyifeng1@

  # MyBatis配置
  mybatis:
    mapper-locations: classpath*:mapper/**/*.xml
    type-aliases-package: com.gaoyifeng.aioserver.infrastructure.dao.po
    configuration:
      map-underscore-to-camel-case: true
      cache-enabled: false
      call-setters-on-nulls: true
      jdbc-type-for-null: 'null'

# 微信配置
weixin:
  config:
    # 微信公众号token
    token: your-weixin-token-here
    # 微信公众号原始ID
    originalid: your-original-id-here
    # 微信公众号AppID（可选）
    appid: your-app-id-here
    # 微信公众号AppSecret（可选）
    appsecret: your-app-secret-here
    # 消息加密密钥（可选）
    encoding-aes-key: your-encoding-aes-key-here
    # 是否开启消息加密
    encrypt-enabled: false
    # 签名有效期（秒）
    signature:
      max-age: 300

# 日志配置
logging:
  level:
    com.gaoyifeng.aioserver: DEBUG
    org.springframework: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/aioserver.log
    max-size: 10MB
    max-history: 30