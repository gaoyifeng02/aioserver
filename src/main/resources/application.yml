server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: aioserver
  profiles:
    active: dev

# 微信配置
weixin:
  config:
    # 微信公众号token
    token: your-weixin-token-here
    # 微信公众号原始ID
    originalid: your-original-id-here
    # 微信公众号AppID（可选）
    appid: your-app-id-here
    # 微信公众号AppSecret（可选）
    appsecret: your-app-secret-here
    # 消息加密密钥（可选）
    encoding-aes-key: your-encoding-aes-key-here
    # 是否开启消息加密
    encrypt-enabled: false
    # 签名有效期（秒）
    signature:
      max-age: 300

# 日志配置
logging:
  level:
    com.gaoyifeng.aioserver: DEBUG
    org.springframework: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/aioserver.log
    max-size: 10MB
    max-history: 30

---
# 开发环境配置
spring:
  profiles: dev

weixin:
  config:
    token: dev-token-123456
    originalid: dev-original-id

---
# 测试环境配置
spring:
  profiles: test

weixin:
  config:
    token: test-token-123456
    originalid: test-original-id

---
# 生产环境配置
spring:
  profiles: prod

weixin:
  config:
    token: ${WEIXIN_TOKEN:prod-token-123456}
    originalid: ${WEIXIN_ORIGINAL_ID:prod-original-id}